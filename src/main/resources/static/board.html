<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board - Mini Trello</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/board.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1 id="board-title">Loading...</h1>
                <p id="board-description" class="board-desc"></p>
            </div>
            <div class="header-actions">
                <button id="edit-board-btn" class="btn">Edit Board</button>
                <a href="/boards.html" class="btn">Back to Boards</a>
                <button id="logout-btn" class="btn">Logout</button>
            </div>
        </div>

        <div id="edit-board-form" class="card hidden">
            <h2>Edit Board</h2>
            <form id="board-edit-form">
                <label>
                    Board Title:
                    <input type="text" id="edit-board-title" required>
                </label>
                <label>
                    Description:
                    <textarea id="edit-board-description"></textarea>
                </label>
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <button type="button" id="cancel-edit-btn" class="btn">Cancel</button>
                <button type="button" id="delete-board-btn" class="btn btn-danger">Delete Board</button>
            </form>
        </div>

        <div id="message" class="message"></div>

        <div id="board-columns" class="kanban-board">
            <!-- Columns will be loaded here -->
        </div>
    </div>

    <script src="/js/board.js"></script>
</body>
</html>
