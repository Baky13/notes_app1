spring:
  application:
    name: notes-app
  
  datasource:
    url: jdbc:postgresql://localhost:5432/notes_db?useUnicode=true&characterEncoding=UTF-8
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        connection:
          characterEncoding: UTF-8
        useUnicode: true
    
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

server:
  port: 8080
  servlet:
    context-path: /

# JWT Configuration
jwt:
  secret: VGhpcyBpcyBhIHNlY3VyZSBhbmQgbG9uZyBrZXkgZm9yIEpXVCBhdXRoZW50aWNhdGlvbiBwdXJwb3Nlcy4=
  expiration: 86400000 # 24 hours in milliseconds

# Logging Configuration
logging:
  level:
    com.example.notesapp: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method